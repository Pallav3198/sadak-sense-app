# One-click deploy on Render (render.com): New + > Blueprint > pick this repo.
# Secrets (sync: false) are typed into the Render dashboard by the owner; they never live in this repo.
services:
  - type: web
    name: sadak-sense
    runtime: docker
    plan: free
    region: singapore           # closest free region to India
    healthCheckPath: /healthz
    envVars:
      - key: AUTOSTART_SIM        # start the virtual fleet on boot so the console is live for demos
        value: "true"
      - key: ENABLE_SIM
        value: "true"
      - key: SARVAM_API_KEY       # Sarvam AI: speech in/out in 8 Indian languages (dashboard.sarvam.ai)
        sync: false
      - key: RESEND_API_KEY       # Resend: real complaint and city-report emails (resend.com)
        sync: false
      - key: REPORT_TO            # pilot test inbox that receives every report (never a government office yet)
        sync: false
      - key: SESSION_SECRET       # seals sign-ins in the phone's cookies; Render generates it
        generateValue: true
      - key: OWNER_EMAIL          # the only Google account that can use the personal side
        sync: false
      - key: PUBLIC_URL           # e.g. https://sadak-sense.onrender.com (used for sign-in return links)
        sync: false
      - key: GOOGLE_CLIENT_ID     # Google Cloud OAuth client: Gmail + Calendar
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MS_CLIENT_ID         # Microsoft Entra app: Teams chats + Outlook calendar
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: TOMTOM_API_KEY       # TomTom: place search + live-traffic routes
        sync: false
      - key: ANDROID_PACKAGE      # Android app link (set after the APK is built)
        sync: false
      - key: ANDROID_SHA256
        sync: false
      - key: ANTHROPIC_API_KEY    # optional: natural-language morning brief; templates otherwise
        sync: false
